name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Web is not a Lime target. Keep the historical workflow file disabled unless
  # the project scope changes explicitly.

  release:
    name: Release
    needs: build
    uses: ./.github/workflows/release.yml
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    secrets: inherit
