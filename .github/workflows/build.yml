name: Build

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: LimeCI
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: lime-ci-only

jobs:
  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - Windows
          - Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Verify .NET
        run: dotnet --info

      - name: Restore and build C# project
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Debug

      - name: Setup Godot 4.7.1 .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Verify Godot
        run: godot --version

      # Headless CI never uses one-click deploy. The repository's editor-authored
      # export_presets.cfg may remember runnable platform presets (notably Android),
      # which starts device polling during editor import and is unnecessary here.
      #
      # The checked-in Spine GDExtension also exposes a Linux editor binary. On the
      # Ubuntu CI host, loading that host-only editor library causes Godot 4.7.1 to
      # segfault during editor/export shutdown after all work has completed. Remove
      # ONLY the Linux x86_64 editor entry in the ephemeral checkout. Windows and
      # Android debug/release entries stay intact and continue to participate in
      # target-platform export.
      - name: Prepare headless CI editor environment
        shell: python
        run: |
          from pathlib import Path

          presets_path = Path("export_presets.cfg")
          text = presets_path.read_text(encoding="utf-8")
          header = "[runnable_presets]"
          first_preset = "[preset.0]"
          start = text.index(header)
          end = text.index(first_preset, start)
          text = text[:start] + header + "\n\n" + text[end:]
          presets_path.write_text(text, encoding="utf-8")

          spine_path = Path("bin/spine/spine_godot_extension.gdextension")
          lines = spine_path.read_text(encoding="utf-8").splitlines()
          lines = [
              line
              for line in lines
              if not line.lstrip().startswith("linux.editor.x86_64 =")
          ]
          spine_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      # Phantom Camera registers GDScript global classes. A fresh checkout has no
      # .godot/global_script_class_cache.cfg, so run Godot's normal import mode
      # after isolating the CI host-only Spine editor binary.
      - name: Bootstrap Godot import and script class cache
        run: godot --headless --path . --import

      - name: Run Phantom Camera regression smoke
        if: matrix.platform == 'Windows'
        run: godot --headless --path . res://spikes/platform_plugin/PlatformPluginSpike.tscn -- --m1-spike

      - name: Run M1.1 project skeleton smoke
        if: matrix.platform == 'Windows'
        run: godot --headless --path . res://tests/smoke/ProjectSkeletonSmoke.tscn

      - name: Run M1.2 player smoke
        if: matrix.platform == 'Windows'
        run: godot --headless --path . res://tests/smoke/PlayerSmoke.tscn

      - name: Setup JDK 17
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v3

      - name: Install Android export dependencies
        if: matrix.platform == 'Android'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Generate Android release keystore
        if: matrix.platform == 'Android'
        run: |
          keytool -genkeypair \
            -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -keypass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Lime CI, OU=CI, O=Lime, L=CI, S=CI, C=TW"

      - name: Export Windows
        if: matrix.platform == 'Windows'
        run: |
          mkdir -p build/windows
          godot --headless --verbose --path . \
            --export-release "Windows" \
            "build/windows/Lime.exe"
          test -f build/windows/Lime.exe
          find build/windows -maxdepth 6 -type f -print | sort

      - name: Export Android
        if: matrix.platform == 'Android'
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . \
            --export-release "Android" \
            "build/android/Lime.apk"
          test -f build/android/Lime.apk
          unzip -l build/android/Lime.apk | grep -E "lib/arm64-v8a/.*spine.*\\.so" || true

      - name: Upload Windows artifact
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Build-Windows
          path: build/windows/

      - name: Upload Android artifact
        if: matrix.platform == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/android/Lime.apk
