name: Build

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: LimeCI
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: lime-ci-only

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - Windows
          - Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Verify .NET
        run: dotnet --info

      - name: Restore and build C# project
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Debug

      - name: Setup Godot 4.7.1 .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Run Phantom Camera runtime smoke
        if: matrix.platform == 'Windows'
        run: godot --headless --path . -- --m1-spike

      - name: Setup JDK 17
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v3

      - name: Install Android export dependencies
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Generate Android release keystore
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -keypass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -dname "CN=Lime CI, OU=Lime, O=Lime, L=CI, S=CI, C=US"

      - name: Export Windows
        if: matrix.platform == 'Windows'
        run: |
          mkdir -p build/windows
          godot --headless --verbose --path . \
            --export-release "Windows" \
            "build/windows/Lime.exe"

      - name: Export Android
        if: matrix.platform == 'Android'
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . \
            --export-release "Android" \
            "build/android/Lime.apk"

      - name: Upload Windows artifact
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Build-Windows
          path: build/windows/

      - name: Upload Android artifact
        if: matrix.platform == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/android/Lime.apk
